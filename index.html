<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Escape the Dark Lord - Idle Edition</title>

<style>
body {
    background: black;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 { color: red; }

#gameBox {
    border: 2px solid #00ffcc;
    padding: 20px;
    max-width: 750px;
    margin: auto;
}

.stat { margin: 6px 0; }

button {
    background: black;
    color: #00ffcc;
    border: 1px solid #00ffcc;
    padding: 8px;
    margin: 5px;
    cursor: pointer;
}

button:hover {
    background: #00ffcc;
    color: black;
}

#combatArea {
    height: 100px;
    margin-top: 20px;
    border: 1px solid #00ffcc;
    position: relative;
}

.character {
    position: absolute;
    top: 40px;
}

#player { left: 50px; }
#enemy { right: 50px; }

#message {
    margin-top: 15px;
    min-height: 40px;
}
</style>
</head>

<body tabindex="0">

<h1>Escape the Dark Lord</h1>

<div id="gameBox">

<div class="stat">Force Power: <span id="power">10</span></div>
<div class="stat">Force Per Second: <span id="fps">1</span></div>
<div class="stat">Health: <span id="health">100</span></div>
<div class="stat">Damage: <span id="damage">10</span></div>

<p><b>Keyboard:</b> E = Fight | B = Boss</p>

<h3>Upgrades</h3>
<button onclick="buyGenerator()">Increase Force Production (Cost: <span id="genCost">25</span>)</button>
<button onclick="buyDamage()">Increase Damage (Cost: <span id="dmgCost">40</span>)</button>
<button onclick="buyHealth()">Increase Max Health (Cost: <span id="hpCost">50</span>)</button>

<br><br>

<button onclick="startCombat(randomEnemy())">Fight Enemy</button>
<button onclick="startCombat({...darkLord})">Fight Dark Lord</button>

<div id="combatArea">
    <div id="player" class="character">You</div>
    <div id="enemy" class="character"></div>
</div>

<div id="message"></div>

</div>

<script>

/* ================= PLAYER STATS ================= */

let forcePower = 10;
let forcePerSecond = 1;

let health = 100;
let maxHealth = 100;
let damage = 10;

let gameOver = false;
let inCombat = false;

/* ================= UPGRADE COSTS ================= */

let generatorCost = 25;
let damageCost = 40;
let healthCost = 50;

/* ================= ENEMIES ================= */

const enemies = [
    { name: "Storm Trooper", health: 40, damage: 5 },
    { name: "Dark Apprentice", health: 70, damage: 8 },
    { name: "Sith Guard", health: 100, damage: 12 }
];

const darkLord = { name: "Dark Lord", health: 250, damage: 25 };

/* ================= UPDATE DISPLAY ================= */

function updateDisplay() {
    document.getElementById("power").textContent = Math.floor(forcePower);
    document.getElementById("fps").textContent = forcePerSecond;
    document.getElementById("health").textContent = health;
    document.getElementById("damage").textContent = damage;

    document.getElementById("genCost").textContent = generatorCost;
    document.getElementById("dmgCost").textContent = damageCost;
    document.getElementById("hpCost").textContent = healthCost;
}

/* ================= IDLE SYSTEM ================= */

setInterval(function() {
    if (!gameOver && !inCombat) {
        forcePower += forcePerSecond;
        updateDisplay();
    }
}, 1000);

/* ================= UPGRADE FUNCTIONS ================= */

function buyGenerator() {
    if (forcePower >= generatorCost) {
        forcePower -= generatorCost;
        forcePerSecond += 1;
        generatorCost = Math.floor(generatorCost * 1.5);
        document.getElementById("message").textContent = "Force production increased!";
        updateDisplay();
    }
}

function buyDamage() {
    if (forcePower >= damageCost) {
        forcePower -= damageCost;
        damage += 5;
        damageCost = Math.floor(damageCost * 1.6);
        document.getElementById("message").textContent = "Damage increased!";
        updateDisplay();
    }
}

function buyHealth() {
    if (forcePower >= healthCost) {
        forcePower -= healthCost;
        maxHealth += 25;
