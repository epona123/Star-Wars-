<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Escape the Dark Lord</title>
<style>
body {
    background: black;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
    padding: 20px;
}

button {
    background: black;
    color: #00ffcc;
    border: 1px solid #00ffcc;
    padding: 8px;
    margin: 5px;
    cursor: pointer;
}

button:hover {
    background: #00ffcc;
    color: black;
}

#combatArea {
    border: 1px solid #00ffcc;
    height: 80px;
    margin-top: 15px;
    line-height: 80px;
}
</style>
</head>

<body>

<h1>Escape the Dark Lord</h1>

<div>
Force Power: <span id="power">10</span><br>
Force Per Second: <span id="fps">1</span><br>
Health: <span id="health">100</span><br>
Damage: <span id="damage">10</span>
</div>

<h3>Upgrades</h3>

<button onclick="buyGenerator()">Increase Production (<span id="genCost">25</span>)</button>
<button onclick="buyDamage()">Increase Damage (<span id="dmgCost">40</span>)</button>
<button onclick="buyHealth()">Increase Health (<span id="hpCost">50</span>)</button>

<br><br>

<button onclick="fightEnemy()">Fight Enemy</button>
<button onclick="fightBoss()">Fight Dark Lord</button>

<div id="combatArea"></div>

<div id="message"></div>

<script>

/* ================= VARIABLES ================= */

var forcePower = 10;
var forcePerSecond = 1;
var health = 100;
var maxHealth = 100;
var damage = 10;

var generatorCost = 25;
var damageCost = 40;
var healthCost = 50;

var gameOver = false;

/* ================= UPDATE DISPLAY ================= */

function updateDisplay() {
    document.getElementById("power").innerHTML = Math.floor(forcePower);
    document.getElementById("fps").innerHTML = forcePerSecond;
    document.getElementById("health").innerHTML = health;
    document.getElementById("damage").innerHTML = damage;
    document.getElementById("genCost").innerHTML = generatorCost;
    document.getElementById("dmgCost").innerHTML = damageCost;
    document.getElementById("hpCost").innerHTML = healthCost;
}

/* ================= IDLE SYSTEM ================= */

setInterval(function() {
    if (!gameOver) {
        forcePower = forcePower + forcePerSecond;
        updateDisplay();
    }
}, 1000);

/* ================= UPGRADES ================= */

function buyGenerator() {
    if (forcePower >= generatorCost) {
        forcePower -= generatorCost;
        forcePerSecond += 1;
        generatorCost = Math.floor(generatorCost * 1.5);
        updateDisplay();
    }
}

function buyDamage() {
    if (forcePower >= damageCost) {
        forcePower -= damageCost;
        damage += 5;
        damageCost = Math.floor(damageCost * 1.5);
        updateDisplay();
    }
}

function buyHealth() {
    if (forcePower >= healthCost) {
        forcePower -= healthCost;
        maxHealth += 25;
        health = maxHealth;
        healthCost = Math.floor(healthCost * 1.5);
        updateDisplay();
    }
}

/* ================= COMBAT ================= */

function fightEnemy() {
    var enemyHealth = 60;
    var enemyDamage = 8;

    while (enemyHealth > 0 && health > 0) {
        enemyHealth -= damage;
        health -= enemyDamage;
    }

    if (health <= 0) {
        document.getElementById("message").innerHTML = "You were defeated.";
        gameOver = true;
    } else {
        forcePower += 40;
        document.getElementById("message").innerHTML = "Enemy defeated!";
    }

    updateDisplay();
}

function fightBoss() {
    var bossHealth = 250;
    var bossDamage = 20;

    while (bossHealth > 0 && health > 0) {
        bossHealth -= damage;
        health -= bossDamage;
    }

    if (health <= 0) {
        document.getElementById("message").innerHTML = "The Dark Lord defeated you.";
        gameOver = true;
    } else {
        document.getElementById("message").innerHTML =
            "You defeated the Dark Lord and escaped!";
        gameOver = true;
    }

    updateDisplay();
}

/* ================= INIT ================= */

updateDisplay();

</script>

</body>
</html>
