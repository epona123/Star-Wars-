<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Escape the Dark Lord - Idle RPG</title>
<style>
body { background: black; color: #00ffcc; font-family: monospace; text-align: center; padding: 20px; }
button { background: black; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px; margin: 5px; cursor: pointer; }
button:hover { background: #00ffcc; color: black; }
#combatArea { border: 1px solid #00ffcc; height: 80px; margin-top: 15px; line-height: 80px; position: relative; }
.character { display: inline-block; padding: 0 20px; transition: transform 0.1s; }
#player { color: #00ffcc; }
#enemy { color: red; }
#inventory { margin-top: 20px; }
.item { display: inline-block; border: 1px solid #00ffcc; padding: 4px 8px; margin: 3px; cursor: default; }
.item:hover { background: #00ffcc; color: black; }
</style>
</head>
<body tabindex="0">

<h1>Escape the Dark Lord</h1>

<div>
Force Power: <span id="power">10</span><br>
Force Per Second: <span id="fps">1</span><br>
Health: <span id="health">100</span> / <span id="maxHealth">100</span><br>
Damage: <span id="damage">10</span>
</div>

<h3>Upgrades</h3>
<button onclick="buyGenerator()">Increase Production (<span id="genCost">25</span>)</button>
<button onclick="buyDamage()">Increase Damage (<span id="dmgCost">40</span>)</button>
<button onclick="buyHealth()">Increase Health (<span id="hpCost">50</span>)</button>

<br><br>

<button onclick="nextCombat()">Fight Next Enemy</button>
<button onclick="fightBoss()">Fight Boss</button>

<div id="combatArea">
  <span id="player" class="character">YOU</span>
  <span id="enemy" class="character"></span>
</div>

<div id="message"></div>

<h3>Inventory</h3>
<div id="inventory"></div>

<script>
/* ================= PLAYER STATS ================= */
var forcePower = 10;
var forcePerSecond = 1;
var health = 100;
var maxHealth = 100;
var damage = 10;

var generatorCost = 25;
var damageCost = 40;
var healthCost = 50;

var gameOver = false;
var inCombat = false;

/* ================= ENEMIES ================= */
var enemies = [
  { name: "Storm Trooper", health: 40, damage: 5 },
  { name: "Imperial Scout", health: 60, damage: 6 },
  { name: "Dark Apprentice", health: 70, damage: 8 },
  { name: "Bounty Hunter", health: 80, damage: 10 },
  { name: "Sith Guard", health: 100, damage: 12 }
];
var boss = { name: "Darth Vader", health: 250, damage: 25 };
var enemyIndex = 0; // Track sequential enemy

/* ================= ITEMS ================= */
var items = [
  { name: "Force Crystal", desc: "Increases Force production by 1 per second.", effect: function(){ forcePerSecond += 1; } },
  { name: "Healing Pack", desc: "Permanently increases max health by 5.", effect: function(){ maxHealth += 5; health +=5; } },
  { name: "Lightsaber Shard", desc: "Permanently increases damage by 2.", effect: function(){ damage +=2; } },
  { name: "Ancient Droid Part", desc: "Increases Force production by 2 per second.", effect: function(){ forcePerSecond += 2; } }
];

/* ================= INVENTORY ================= */
var inventory = {}; // { "Force Crystal": {count:3, desc:"..."} }

/* ================= UPDATE DISPLAY ================= */
function updateDisplay(){
  document.getElementById("power").innerHTML = Math.floor(forcePower);
  document.getElementById("fps").innerHTML = forcePerSecond;
  document.getElementById("health").innerHTML = Math.floor(health);
  document.getElementById("maxHealth").innerHTML = maxHealth;
  document.getElementById("damage").innerHTML = damage;
  document.getElementById("genCost").innerHTML = generatorCost;
  document.getElementById("dmgCost").innerHTML = damageCost;
  document.getElementById("hpCost").innerHTML = healthCost;

  // Inventory display
  var invDiv = document.getElementById("inventory");
  invDiv.innerHTML = "";
  for(var key in inventory){
    var itemDiv = document.createElement("div");
    itemDiv.className="item";
    itemDiv.title = inventory[key].desc;
    itemDiv.innerHTML = key + " x" + inventory[key].count;
    invDiv.appendChild(itemDiv);
  }
}

/* ================= IDLE SYSTEM ================= */
setInterval(function(){
  if(!gameOver){
    forcePower += forcePerSecond;

    // Health regen
    health += 1;
    if(health>maxHealth) health=maxHealth;

    updateDisplay();
  }
},1000);

/* ================= UPGRADES ================= */
function buyGenerator(){
  if(forcePower>=generatorCost){ forcePower-=generatorCost; forcePerSecond+=1; generatorCost=Math.floor(generatorCost*1.5); document.getElementById("message").innerHTML="Force production increased!"; updateDisplay(); }
}
function buyDamage(){
  if(forcePower>=damageCost){ forcePower-=damageCost; damage+=5; damageCost=Math.floor(damageCost*1.5); document.getElementById("message").innerHTML="Damage increased!"; updateDisplay(); }
}
function buyHealth(){
  if(forcePower>=healthCost){ forcePower-=healthCost; maxHealth+=25; health=maxHealth; healthCost=Math.floor(healthCost*1.5); document.getElementById("message").innerHTML="Max health increased!"; updateDisplay(); }
}

/* ================= COMBAT ANIMATION ================= */
function flash(element){
  var el=document.getElementById(element);
  el.style.transform="scale(1.3)";
  setTimeout(function(){el.style.transform="scale(1)";},100);
}

/* ================= FIGHT NEXT ENEMY ================= */
function nextCombat(){
  if(gameOver || inCombat) return;
  if(enemyIndex>=enemies.length){ document.getElementById("message").innerHTML="All regular enemies defeated!"; return; }

  inCombat=true;
  var enemy = Object.assign({}, enemies[enemyIndex]);
  var enemyName=enemy.name;
  var enemyHealth=enemy.health;
  var enemyDamage=enemy.damage;
  document.getElementById("enemy").innerHTML=enemyName;

  function combatStep(){
    if(health<=0){ document.getElementById("message").innerHTML="You were defeated by "+enemyName+"."; gameOver=true; inCombat=false; return; }
    if(enemyHealth<=0){
      document.getElementById("message").innerHTML=enemyName+" defeated!";
      forcePower+=40;

      // Loot drop
      if(Math.random()<0.5){
        var lootItem = items[Math.floor(Math.random()*items.length)];
        if(inventory[lootItem.name]){ inventory[lootItem.name].count+=1; }
        else{ inventory[lootItem.name]={count:1,desc:lootItem.desc}; }
        lootItem.effect();
      }

      enemyIndex++;
      inCombat=false;
      document.getElementById("enemy").innerHTML="";
      updateDisplay();
      return;
    }

    // Attack animation
    flash("player");
    flash("enemy");
    enemyHealth-=damage;
    health-=enemyDamage;
    updateDisplay();

    setTimeout(combatStep, 500);
  }

  combatStep();
}

/* ================= FIGHT BOSS ================= */
function fightBoss(){
  if(gameOver || inCombat) return;
  inCombat=true;

  var bossName=boss.name;
  var bossHealth=boss.health;
  var bossDamage=boss.damage;
  document.getElementById("enemy").innerHTML=bossName;

  function combatStep(){
    if(health<=0){ document.getElementById("message").innerHTML=bossName+" defeated you."; gameOver=true; inCombat=false; return; }
    if(bossHealth<=0){ document.getElementById("message").innerHTML="You defeated "+bossName+" and escaped!"; gameOver=true; inCombat=false; document.getElementById("enemy").innerHTML=""; updateDisplay(); return; }

    flash("player");
    flash("enemy");
    bossHealth-=damage;
    health-=bossDamage;
    updateDisplay();
    setTimeout(combatStep, 500);
  }

  combatStep();
}

/* ================= KEYBOARD ================= */
document.addEventListener("keydown",function(e){
  if(gameOver) return;
  if(e.key.toLowerCase()==="e") nextCombat();
  if(e.key.toLowerCase()==="b") fightBoss();
});

/* ================= INIT ================= */
updateDisplay();
document.body.focus();
</script>

</body>
</html>
