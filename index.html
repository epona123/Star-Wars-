<html>
<head>
<meta charset="UTF-8">
<title>Escape the Dark Lord - Enhanced</title>

<style>
body {
    background: black;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    color: red;
}

#gameBox {
    border: 2px solid #00ffcc;
    padding: 20px;
    max-width: 700px;
    margin: auto;
}

.stat {

}

#combatArea {
    height: 120px;
    margin-top: 20px;
    border: 1px solid #00ffcc;
    position: relative;
    overflow: hidden;
}

.character {
    position: absolute;
    top: 40px;
    font-size: 18px;
    transition: all 0.3s ease;
}

#player {
    left: 50px;
}

#enemy {
    right: 50px;
}

.attackFlash {
    color: red;
    font-weight: bold;
    animation: flash 0.3s;
}

@keyframes flash {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

button {
    background: black;
    color: #00ffcc;
    border: 1px solid #00ffcc;
    padding: 8px;
    margin: 5px;
    cursor: pointer;
}

button:hover {
    background: #00ffcc;
    color: black;
}

#message {
    margin-top: 15px;
    min-height: 40px;
}
</style>
</head>

</div>

<div id="message"></div>

</div>
