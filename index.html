<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Escape the Dark Lord</title>

<style>
body {
    background: black;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 { color: red; }

#gameBox {
    border: 2px solid #00ffcc;
    padding: 20px;
    max-width: 700px;
    margin: auto;
}

.stat { margin: 8px 0; }

button {
    background: black;
    color: #00ffcc;
    border: 1px solid #00ffcc;
    padding: 8px;
    margin: 5px;
    cursor: pointer;
}

button:hover {
    background: #00ffcc;
    color: black;
}

#combatArea {
    height: 100px;
    margin-top: 20px;
    border: 1px solid #00ffcc;
    position: relative;
}

.character {
    position: absolute;
    top: 40px;
}

#player { left: 50px; }
#enemy { right: 50px; }

#message {
    margin-top: 15px;
    min-height: 40px;
}
</style>
</head>

<body tabindex="0">

<h1>Escape the Dark Lord</h1>

<div id="gameBox">

<div class="stat">Force Power: <span id="power">10</span></div>
<div class="stat">Level: <span id="level">1</span></div>
<div class="stat">Health: <span id="health">100</span></div>
<div class="stat">Damage: <span id="damage">10</span></div>

<p><b>Keyboard:</b> T = Train | E = Fight | U = Upgrade | B = Boss</p>

<!-- BUTTON BACKUPS -->
<button onclick="train()">Train</button>
<button onclick="startCombat(randomEnemy())">Fight Enemy</button>
<button onclick="upgrade()">Upgrade</button>
<button onclick="startCombat({...darkLord})">Fight Dark Lord</button>

<div id="combatArea">
    <div id="player" class="character">You</div>
    <div id="enemy" class="character"></div>
</div>

<div id="message"></div>

</div>

<script>

/* ================= GAME VARIABLES ================= */

let forcePower = 10;
let level = 1;
let health = 100;
let maxHealth = 100;
let damage = 10;

let gameOver = false;
let inCombat = false;

/* ================= ENEMIES ================= */

const enemies = [
    { name: "Storm Trooper", health: 40, damage: 5 },
    { name: "Dark Apprentice", health: 70, damage: 8 },
    { name: "Sith Guard", health: 100, damage: 12 }
];

const darkLord = { name: "Dark Lord", health: 200, damage: 20 };

/* ================= UPDATE DISPLAY ================= */

function updateDisplay() {
    document.getElementById("power").textContent = Math.floor(forcePower);
    document.getElementById("level").textContent = level;
    document.getElementById("health").textContent = health;
    document.getElementById("damage").textContent = damage;
}

/* ================= IDLE SYSTEM ================= */

setInterval(function() {
    if (!gameOver && !inCombat) {
        forcePower += level;
        updateDisplay();
    }
}, 1000);

/* ================= KEYBOARD CONTROLS ================= */

document.addEventListener("keydown", function(e) {

    if (gameOver || inCombat) return;

    const key = e.key.toLowerCase();

    if (key === "t") train();
    if (key === "e") startCombat(randomEnemy());
    if (key === "u") upgrade();
    if (key === "b") startCombat({...darkLord});
});

/* ================= TRAIN ================= */

function train() {
    forcePower += 5;
    level++;
    damage += 2;
    document.getElementById("message").textContent = "You grow stronger.";
    updateDisplay();
}

/* ================= UPGRADE ================= */

function upgrade() {
    if (forcePower >= 50) {
        forcePower -= 50;
        maxHealth += 20;
        health = maxHealth;
        damage += 5;
        document.getElementById("message").textContent = "Upgrade complete!";
    } else {
        document.getElementById("message").textContent = "Not enough Force Power!";
    }
    updateDisplay();
}

/* ================= RANDOM ENEMY ================= */

function randomEnemy() {
    return {...enemies[Math.floor(Math.random() * enemies.length)]};
}

/* ================= COMBAT ================= */

function startCombat(enemy) {

    inCombat = true;
    document.getElementById("enemy").textContent = enemy.name;
    document.getElementById("message").textContent = "Combat started!";

    function combatTurn() {

        enemy.health -= damage;
        flash("enemy");

        if (enemy.health <= 0) {
            forcePower += 30;
            document.getElementById("message").textContent =
                enemy.name + " defeated!";
            endCombat();
            if (enemy.name === "Dark Lord") winGame();
            return;
        }

        health -= enemy.damage;
        flash("player");

        if (health <= 0) {
            loseGame();
            return;
        }

        updateDisplay();
        setTimeout(combatTurn, 800);
    }

    setTimeout(combatTurn, 800);
}

/* ================= FLASH ANIMATION ================= */

function flash(id) {
    let el = document.getElementById(id);
    el.style.opacity = "0.3";
    setTimeout(function() {
        el.style.opacity = "1";
    }, 200);
}

/* ================= END STATES ================= */

function endCombat() {
    inCombat = false;
    document.getElementById("enemy").textContent = "";
    updateDisplay();
}

function winGame() {
    document.getElementById("message").textContent =
        "You defeated the Dark Lord and escaped!";
    gameOver = true;
}

function loseGame() {
    document.getElementById("message").textContent =
        "You were too weak to survive...";
    gameOver = true;
}

/* ================= INIT ================= */

updateDisplay();
document.body.focus(); // safe now because body exists

</script>

</body>
</html>
